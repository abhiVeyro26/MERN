
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Tech Club</title>
</head>
<body>

    <h1>Tech Club</h1>
    <h2>Register</h2>

    <form>
        <label for="name">Name:</label>
        <input type="text" id="name" name="name"
               placeholder="Your name">
        <br><br>

        <label for="email">Email:</label>
        <input type="email" id="email" name="email">
        <br><br>

        <label for="password">Password:</label>
        <input type="password" id="password" name="password">
        <br><br>

        <label for="dob">Date of birth:</label>
        <input type="date" id="dob" name="dob">
        <br><br>

        <label for="phone">Phone:</label>
        <input type="tel" id="phone" name="phone">
        <br><br>

        <label>Gender:</label>
        <input type="radio" id="male" name="gender" value="Male">
        <label for="male">Male</label>
        <input type="radio" id="female" name="gender" value="Female">
        <label for="female">Female</label>
        <br><br>

        <label>Interests:</label>
        <input type="checkbox" id="web" name="interest" value="Web">
        <label for="web">Web</label>
        <input type="checkbox" id="dsa" name="interest" value="DSA">
        <label for="dsa">DSA</label>
        <br><br>

        <label for="branch">Branch:</label>
        <select id="branch" name="branch">
            <option value="CSE">CSE</option>
            <option value="IT">IT</option>
            <option value="ECE">ECE</option>
        </select>
        <br><br>

        <label for="message">Why do you want to join?</label>
        <br>
        <textarea id="message" name="message"
                  rows="3" cols="30"></textarea>
        <br><br>

        <button type="submit">Register</button>
    </form>

</body>
</html>
