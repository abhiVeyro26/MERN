
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tech Club</title>

    <style>
        /* Task 5.2: Four CSS selectors */

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 24px;
            background-color: #eef2ff;
            color: #172033;
            font-family: Arial, sans-serif;
        }

        h1 {
            color: white;
            text-align: center;
        }

        #hero {
            background-color: #315be8;
            padding: 35px;
            text-align: center;
            border-radius: 12px;
            color: white;
        }

        .card {
            background-color: white;
            padding: 22px;
            margin-top: 22px;
            border-radius: 12px;
        }
    </style>
</head>

<body>

    <header id="hero">
        <h1>Tech Club</h1>
        <p>Learn. Code. Grow.</p>
    </header>

    <section class="card">
        <h2>Upcoming Events</h2>

        <table border="1" cellpadding="12" cellspacing="0" width="100%">
            <thead>
                <tr>
                    <th>Event</th>
                    <th>Date</th>
                    <th>Venue</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>HTML Workshop</td>
                    <td>12 Nov</td>
                    <td>Lab 1</td>
                </tr>
                <tr>
                    <td>Hackathon</td>
                    <td>20 Nov</td>
                    <td>Seminar Hall</td>
                </tr>
            </tbody>
        </table>
    </section>

    <section class="card">
        <h2>Register</h2>

        <form>
            <label for="name">Name:</label>
            <input type="text" id="name" name="name" placeholder="Your name" required>
            <br><br>

            <label for="email">Email:</label>
            <input type="email" id="email" name="email" placeholder="you@example.com" required>
            <br><br>

            <button type="submit">Register</button>
        </form>
    </section>

</body>
</html>
